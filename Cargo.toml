[package]
name = "boxset"
version = "0.1.0"
edition = "2024"
description = "Prepare video for the web: transcode, poster frames, and subtitles from one command"
license = "MIT OR Apache-2.0"
repository = "https://github.com/edgfoo/boxset"

# `cargo release <level>` bumps, commits, tags and pushes. Pushing the tag is
# what starts .github/workflows/release.yml, which builds and publishes.
[package.metadata.release]
# boxset ships via Homebrew, not crates.io.
publish = false
tag-name = "v{{version}}"
tag-message = "v{{version}}"
pre-release-commit-message = "chore(release): v{{version}}"
allow-branch = ["main"]

[lib]
name = "boxset"
path = "src/lib.rs"

[[bin]]
name = "boxset"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "0.8"
ureq = "3.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"
