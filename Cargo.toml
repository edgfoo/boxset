[package]
name = "boxset"
version = "0.6.0"
edition = "2024"
description = "Prepare video for the web: transcode, poster frames, and subtitles from one command"
license = "MIT OR Apache-2.0"
repository = "https://github.com/edgfoo/boxset"

# `cargo release <level>` bumps, commits, tags and pushes. Pushing the tag is
# what starts .github/workflows/release.yml, which builds and publishes.
[package.metadata.release]
# boxset ships via Homebrew, not crates.io.
publish = false
tag-name = "v{{version}}"
tag-message = "v{{version}}"
pre-release-commit-message = "chore(release): v{{version}}"
allow-branch = ["main"]
# The schema is derived from the field table, so the release regenerates it
# rather than trusting it to be committed. This runs before the release commit,
# which stages the whole tree, so the tag always carries a schema matching the
# code that the config's pinned URL names.
pre-release-hook = ["sh", "-c", "cargo run --quiet -- --print-schema > schema.json"]

[lib]
name = "boxset"
path = "src/lib.rs"

[[bin]]
name = "boxset"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
directories = "6.0.0"
percent-encoding = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
ureq = "3.4.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = "0.2.4"

# `metal` is a default feature of transcribe-cpp, so elsewhere defaults are off.
[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-cpp = { version = "0.2.4", default-features = false }
